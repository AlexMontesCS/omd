<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Frame Demo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mathjs@14.5.2/lib/browser/math.js"></script>

    <style>
        body {
            margin: 0;
            display: flex;
            font-family: "Albert Sans", sans-serif;
            background: #f5f5f5;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            height: 100vh;
            overflow: hidden;
        }

        .controls {
            width: 300px;
            background: white;
            padding: 20px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }

        .control-group h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .info {
            background: #e7f3ff;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #0066cc;
            margin-bottom: 15px;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 0 5px;
        }

        .frame-info {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin: 10px 0;
            max-height: 150px;
            overflow-y: auto;
        }

        svg {
            user-select: none;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }

        .textInput {
            border-style: solid;
            border-color: black;
            box-sizing: border-box;
            border-radius: 4px;
            font-size: 2em;
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <div id="canvas-ui"></div>
    </div>
    
    <div class="controls">
        <h2>🎯 Focus Frame Demo</h2>
        
        <div class="info">
            <strong>Focus Frames</strong> capture content within a defined area and convert it to bitmaps!
        </div>
        
        <div class="control-group">
            <h3>📏 Create Frame</h3>
            <div>
                Position: X <input type="number" id="frameX" value="100"> Y <input type="number" id="frameY" value="100">
            </div>
            <div style="margin-top: 10px;">
                Size: W <input type="number" id="frameW" value="300"> H <input type="number" id="frameH" value="200">
            </div>
            <button onclick="createFrame()">Create Focus Frame</button>
            <button onclick="createInvisibleFrame()">Create Invisible Frame</button>
        </div>
        
        <div class="control-group">
            <h3>🎨 Tools</h3>
            <button onclick="window.canvas.toolbar?.activateTool('Pencil')">✏️ Pencil Tool</button>
            <button onclick="window.canvas.toolbar?.activateTool('Math')">🧮 Math Tool</button>
            <button onclick="window.canvas.toolbar?.activateTool('Eraser')">🧹 Eraser Tool</button>
            <button onclick="window.canvas.toolbar?.activateTool('Select')">🖱️ Select Tool</button>
        </div>
        
        <div class="control-group">
            <h3>👁️ View Options</h3>
            <button onclick="window.canvas.toggleGrid()">📐 Toggle Grid</button>
            <button onclick="window.canvas.toggleToolbar()">🛠️ Toggle Toolbar</button>
            <button onclick="createCanvasWithGrid()">📊 New Canvas + Grid</button>
            <button onclick="createMinimalCanvas()">⚡ Minimal Canvas</button>
        </div>
        
        <div class="control-group">
            <h3>📸 Capture</h3>
            <button onclick="captureFrame()">Capture Content</button>
            <button onclick="showBitmap()">Show Bitmap</button>
            <button onclick="downloadImage()">💾 Download Image</button>
            <button onclick="clearAllFrames()">🗑️ Clear All Frames</button>
        </div>
        
        <div class="control-group">
            <h3>📊 Frame Info</h3>
            <div id="frameInfo" class="frame-info">
                No frames created yet.
            </div>
        </div>
        
        <div class="control-group">
            <h3>🔧 Quick Actions</h3>
            <button onclick="runDemo()">🚀 Run Demo</button>
            <button onclick="createMultipleFrames()">➕ Multiple Frames</button>

        </div>
    </div>

    <script src="../jsvg/jsvg.js"></script>
    <script src="../jsvg/jsvgComponents.js"></script>
    <script type="module">
        // Import Canvas class for canvas recreation
        import { Canvas } from '../canvas/cuiCanvas.js';
        import { FocusFrameManager } from '../canvas/cuiFocusFrame.js';
        window.Canvas = Canvas;
        window.FocusFrameManager = FocusFrameManager;
    </script>
    <script type="module" src="../canvas.js"></script>
    
    <script>
        let currentFrameId = null;
        
        function createFrame() {
            const x = parseInt(document.getElementById('frameX').value);
            const y = parseInt(document.getElementById('frameY').value);
            const width = parseInt(document.getElementById('frameW').value);
            const height = parseInt(document.getElementById('frameH').value);
            
            const { id, frame } = window.FocusFrame.create({
                x, y, width, height,
                showOutline: true,
                outlineColor: '#ff6b35',
                outlineWidth: 2,
                outlineDashed: true
            });
            
            currentFrameId = id;
            window.FocusFrame.setActive(id);
            updateFrameInfo();
            
            console.log(`Created focus frame: ${id}`);
        }
        
        function createInvisibleFrame() {
            const x = parseInt(document.getElementById('frameX').value);
            const y = parseInt(document.getElementById('frameY').value);
            const width = parseInt(document.getElementById('frameW').value);
            const height = parseInt(document.getElementById('frameH').value);
            
            const { id, frame } = window.FocusFrame.create({
                x, y, width, height,
                showOutline: false
            });
            
            currentFrameId = id;
            window.FocusFrame.setActive(id);
            updateFrameInfo();
            
            console.log(`Created invisible focus frame: ${id}`);
        }
        
        function captureFrame() {
            if (!currentFrameId) {
                alert('Please create a frame first!');
                return;
            }
            
            const data = window.FocusFrame.capture();
            console.log('Captured data:', data);
            updateFrameInfo();
            
            if (data.strokes.length === 0 && data.mathNodes.length === 0) {
                alert('No content found in frame! Try drawing something first.');
            } else {
                alert(`Captured ${data.strokes.length} strokes and ${data.mathNodes.length} math nodes!`);
            }
        }
        
        function showBitmap() {
            if (!currentFrameId) {
                alert('Please create a frame first!');
                return;
            }
            
            const canvas = window.FocusFrame.toBitmap();
            if (canvas) {
                // Open bitmap in new window
                const newWindow = window.open('', '_blank');
                newWindow.document.write(`
                    <html>
                        <head><title>Focus Frame Bitmap</title></head>
                        <body style="margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f0f0f0;">
                            <div style="text-align:center;">
                                <h2>Focus Frame Capture</h2>
                                <div style="border:1px solid #ccc; display:inline-block; background:white; padding:10px;">
                                    ${canvas.outerHTML}
                                </div>
                                <br><br>
                                <button onclick="window.close()">Close</button>
                            </div>
                        </body>
                    </html>
                `);
            }
        }
        
        function downloadImage() {
            if (!currentFrameId) {
                alert('Please create a frame first!');
                return;
            }
            
            window.FocusFrame.download(currentFrameId, 'my-focus-frame.png');
        }
        
        function clearAllFrames() {
            const allResults = window.FocusFrame.captureAll();
            Object.keys(allResults).forEach(frameId => {
                window.FocusFrame.remove(frameId);
            });
            currentFrameId = null;
            updateFrameInfo();
        }
        
        function updateFrameInfo() {
            const infoDiv = document.getElementById('frameInfo');
            const allResults = window.FocusFrame.captureAll();
            const frameCount = Object.keys(allResults).length;
            
            if (frameCount === 0) {
                infoDiv.innerHTML = 'No frames created yet.';
                return;
            }
            
            let html = `<strong>Frames: ${frameCount}</strong><br>`;
            if (currentFrameId) {
                html += `<strong>Active:</strong> ${currentFrameId}<br><br>`;
            }
            
            Object.entries(allResults).forEach(([id, data]) => {
                html += `<div style="margin-bottom:10px; padding:8px; background:white; border-radius:4px;">
                    <strong>${id}</strong><br>
                    📊 ${data.strokes.length} strokes, ${data.mathNodes.length} math nodes<br>
                    📐 ${Math.round(data.bounds.width)}×${Math.round(data.bounds.height)}px
                </div>`;
            });
            
            infoDiv.innerHTML = html;
        }
        
        function runDemo() {
            // Clear existing frames
            clearAllFrames();
            
            // Create a demo frame
            const { id } = window.FocusFrame.create({
                x: 150,
                y: 150,
                width: 400,
                height: 250,
                showOutline: true,
                outlineColor: '#28a745',
                outlineWidth: 3
            });
            
            currentFrameId = id;
            window.FocusFrame.setActive(id);
            
            // Switch to pencil tool
            window.canvas.toolbar.activateTool('Pencil');
            
            updateFrameInfo();
            alert('Demo frame created! Draw inside the green frame, then click "Capture Content"');
        }
        
        function createMultipleFrames() {
            // Create multiple frames for testing
            const positions = [
                { x: 100, y: 100, color: '#ff6b35' },
                { x: 300, y: 200, color: '#28a745' },
                { x: 500, y: 150, color: '#6f42c1' }
            ];
            
            positions.forEach((pos, i) => {
                const { id } = window.FocusFrame.create({
                    x: pos.x,
                    y: pos.y,
                    width: 200,
                    height: 150,
                    showOutline: true,
                    outlineColor: pos.color,
                    outlineWidth: 2
                });
                
                if (i === 0) {
                    currentFrameId = id;
                    window.FocusFrame.setActive(id);
                }
            });
            
            updateFrameInfo();
            alert('Created 3 frames! Draw in them, then use "Capture All"');
        }
        


        function createCanvasWithGrid() {
            // Remove existing canvas
            const canvasRoot = document.getElementById("canvas-ui");
            if (window.canvas) {
                canvasRoot.removeChild(window.canvas.svgObject);
            }
            
            // Create new canvas with grid
            const container = document.querySelector('.canvas-container');
            const rect = container.getBoundingClientRect();
            
            window.canvas = new window.Canvas({
                width: rect.width,
                height: rect.height,
                showToolbar: true,
                showGrid: true
            });
            
            // Re-initialize everything
            window.canvas.toolbar.activateTool("Pencil");
            window.focusFrameManager = new window.FocusFrameManager(window.canvas);
            canvasRoot.appendChild(window.canvas.svgObject);
            
            // Clear frames
            currentFrameId = null;
            updateFrameInfo();
            
            alert('Canvas recreated with grid enabled!');
        }
        
        function createMinimalCanvas() {
            // Remove existing canvas
            const canvasRoot = document.getElementById("canvas-ui");
            if (window.canvas) {
                canvasRoot.removeChild(window.canvas.svgObject);
            }
            
            // Create minimal canvas (no grid, no toolbar)
            const container = document.querySelector('.canvas-container');
            const rect = container.getBoundingClientRect();
            
            window.canvas = new window.Canvas({
                width: rect.width,
                height: rect.height,
                showToolbar: false,
                showGrid: false
            });
            
            // Initialize focus frame manager
            window.focusFrameManager = new window.FocusFrameManager(window.canvas);
            canvasRoot.appendChild(window.canvas.svgObject);
            
            // Clear frames
            currentFrameId = null;
            updateFrameInfo();
            
            alert('Minimal canvas created! No toolbar or grid. Use View Options to toggle them back on.');
        }

        // Initialize when page loads
        window.addEventListener('load', () => {
            // Resize canvas to fit container properly
            const container = document.querySelector('.canvas-container');
            if (window.canvas && container) {
                const rect = container.getBoundingClientRect();
                window.canvas.resize(rect.width, rect.height);
            }
            updateFrameInfo();
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            setTimeout(() => {
                const container = document.querySelector('.canvas-container');
                if (window.canvas && container) {
                    const rect = container.getBoundingClientRect();
                    window.canvas.resize(rect.width, rect.height);
                }
            }, 100); // Small delay to ensure container has resized
        });
    </script>
</body>
</html>
