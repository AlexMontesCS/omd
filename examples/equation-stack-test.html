<!DOCTYPE html>
<html>
<head>
    <title>Equation Stack Test</title>
    <!-- JSVG Library -->
    <script src="../jsvg/jsvg.js"></script>
    <script src="../jsvg/jsvgComponents.js"></script>
    <!-- Math.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/9.4.4/math.js"></script>
    <!-- Font for consistent rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="module">
        import { omdDisplay } from '../omd/display/omdDisplay.js';
        import { omdEquationStack } from '../omd/core/omdEquationStack.js';
        import { omdEquationNode } from '../omd/nodes/omdEquationNode.js';

        document.addEventListener('DOMContentLoaded', () => {
            const display = new omdDisplay(document.getElementById('canvas-container'), {
                fontSize: 32,
                centerContent: true,
                topMargin: 40
            });

            const stack = new omdEquationStack([omdEquationNode.fromString("2x+3=5")], {
                stepVisualizer: true,
                toolbar: true
            });

            display.render(stack);
        });
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Hide scrollbars */
            font-family: 'Albert Sans', sans-serif; 
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
</body>
</html>
