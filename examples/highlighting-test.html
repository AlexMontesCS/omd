<!DOCTYPE html>
<html>
<head>
    <title>OMD FOIL Highlight Test</title>
    <style>
        body { font-family: sans-serif; }
    </style>
</head>
<body>
    <h1>FOIL Highlighting Test</h1>
    <p>This page tests the advanced provenance highlighting for a many-to-many transformation (FOIL).</p>
    <div id="canvas" style="width: 100%; max-width: 900px; aspect-ratio: 16/9; border: 1px solid #ccc; margin: 0 auto; min-height: 0; min-width: 0; display: flex; align-items: stretch; justify-content: stretch;"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
    <script src="../jsvg/jsvg.js"></script>
    <script src="../jsvg/jsvgComponents.js"></script>

    <script type="module">
        import { omdDisplay } from '../omd/core/index.js';

        const container = document.getElementById('canvas');
        const display = new omdDisplay(container, { stepVisualizer: true });
        const expression = '(a+b)*(c+d)';
        // Render the initial expression. This will create an omdStepVisualizer.
        const sequence = display.render(expression);
        // Now, simplify it. The visualizer is also a sequence node.
        sequence.simplify();


    </script>
</body>
</html>
