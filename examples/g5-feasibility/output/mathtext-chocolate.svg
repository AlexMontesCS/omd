<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 71" width="400" height="71"><g x="0" y="0" width="500" height="500" viewBox="0 0 500 500"><foreignObject x="0" y="0" overflow="visible" width="402" height="73"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;box-sizing:border-box;width:400px;white-space:normal;font-family:Albert Sans, Arial, Helvetica, sans-serif;font-size:19px;line-height:1.85;font-weight:400;color:#222222;overflow-wrap:break-word;">Leia has &lt;span class="omd-math notranslate omd-math-gap-l omd-math-gap-r" translate="no" data-plain="2 1/2" aria-label="2 1/2"&gt;&lt;span class="omd-math-mixed"&gt;&lt;span class="omd-math-whole"&gt;2&lt;/span&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;1&lt;/span&gt;&lt;span class="omd-math-den"&gt;2&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; pounds of chocolate. She puts &lt;span class="omd-math notranslate omd-math-gap-l omd-math-gap-r" translate="no" data-plain="1/4" aria-label="1/4"&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;1&lt;/span&gt;&lt;span class="omd-math-den"&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; pound into each bag.</div></foreignObject></g></svg>