<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 106" width="430" height="106"><g x="0" y="0" width="500" height="500" viewBox="0 0 500 500"><foreignObject x="0" y="0" overflow="visible" width="432" height="108"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;box-sizing:border-box;width:430px;white-space:normal;font-family:Albert Sans, Arial, Helvetica, sans-serif;font-size:19px;line-height:1.85;font-weight:400;color:#222222;overflow-wrap:break-word;">&lt;strong&gt;11&lt;/strong&gt; A baker has &lt;span class="omd-math notranslate omd-math-gap-l omd-math-gap-r" translate="no" data-plain="3/4" aria-label="3/4"&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;3&lt;/span&gt;&lt;span class="omd-math-den"&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; of a box of muffin mix. He pours all the muffin mix equally into &lt;span class="omd-math notranslate omd-math-gap-l omd-math-gap-r" translate="no" data-plain="6" aria-label="6"&gt;6&lt;/span&gt; bowls.</div></foreignObject></g></svg>