<svg xmlns="http://www.w3.org/2000/svg" width="166" height="145" viewBox="0 0 166 145"><rect width="100%" height="100%" fill="#ffffff"/><g x="0" y="0" width="500" height="500" viewBox="0 0 500 500"><foreignObject x="0" y="0" overflow="visible" width="168" height="147"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;box-sizing:border-box;white-space:nowrap;font-family:Albert Sans, Arial, Helvetica, sans-serif;font-size:26px;line-height:1.85;font-weight:400;color:#222222;overflow-wrap:break-word;">5 ÷ 2 = &lt;span class="omd-math notranslate omd-math-gap-l" translate="no" data-plain="5/2" aria-label="5/2"&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;5&lt;/span&gt;&lt;span class="omd-math-den"&gt;2&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;<br></br>&lt;span class="omd-math notranslate omd-math-gap-r" translate="no" data-plain="5/2" aria-label="5/2"&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;5&lt;/span&gt;&lt;span class="omd-math-den"&gt;2&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; = &lt;span class="omd-math notranslate omd-math-gap-l" translate="no" data-plain="5 1/2" aria-label="5 1/2"&gt;&lt;span class="omd-math-mixed"&gt;&lt;span class="omd-math-whole"&gt;5&lt;/span&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;1&lt;/span&gt;&lt;span class="omd-math-den"&gt;2&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;<br></br>&lt;span class="omd-math notranslate omd-math-gap-r" translate="no" data-plain="6/2" aria-label="6/2"&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;6&lt;/span&gt;&lt;span class="omd-math-den"&gt;2&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; = 3</div></foreignObject></g></svg>