<svg xmlns="http://www.w3.org/2000/svg" width="669" height="45" viewBox="0 0 669 45"><rect width="100%" height="100%" fill="#ffffff"/><g x="0" y="0" width="500" height="500" viewBox="0 0 500 500"><foreignObject x="0" y="0" overflow="visible" width="671" height="47"><div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;box-sizing:border-box;white-space:nowrap;font-family:Albert Sans, Arial, Helvetica, sans-serif;font-size:24px;line-height:1.85;font-weight:400;color:#222222;overflow-wrap:break-word;">6 × &lt;span class="omd-math notranslate omd-math-gap-l omd-math-gap-r" translate="no" data-plain="5/8" aria-label="5/8"&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;5&lt;/span&gt;&lt;span class="omd-math-den"&gt;8&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; = (6 × &lt;span class="omd-math notranslate omd-math-gap-l" translate="no" data-plain="1/8" aria-label="1/8"&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;1&lt;/span&gt;&lt;span class="omd-math-den"&gt;8&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;) × 5 = &lt;span class="omd-math notranslate omd-math-gap-l omd-math-gap-r" translate="no" data-plain="6/8" aria-label="6/8"&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;6&lt;/span&gt;&lt;span class="omd-math-den"&gt;8&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; × 5 = &lt;span class="omd-math notranslate omd-math-gap-l omd-math-gap-r" translate="no" data-plain="30/8" aria-label="30/8"&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;30&lt;/span&gt;&lt;span class="omd-math-den"&gt;8&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; = &lt;span class="omd-math notranslate omd-math-gap-l" translate="no" data-plain="3 3/4" aria-label="3 3/4"&gt;&lt;span class="omd-math-mixed"&gt;&lt;span class="omd-math-whole"&gt;3&lt;/span&gt;&lt;span class="omd-math-frac"&gt;&lt;span class="omd-math-num"&gt;3&lt;/span&gt;&lt;span class="omd-math-den"&gt;4&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;</div></foreignObject></g></svg>