<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMD Equation (Visual) – math.js parsing demo</title>
  <script async src="https://ga.jspm.io/npm:es-module-shims@1.9.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@teachinglab/jsvg": "../jsvg/jsvgComponents.js"
      }
    }
  </script>
  <style>
    body { font-family: 'Albert Sans', Arial, sans-serif; max-width: 860px; margin: 32px auto; padding: 0 20px; }
    h1 { margin-bottom: 8px; }
    p { color: #334155; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    input { flex: 1 1 320px; padding: 10px; font-size: 16px; }
    button { padding: 10px 14px; font-size: 15px; cursor: pointer; }
    #equation-host { min-height: 160px; display: grid; place-items: center; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 10px; padding: 16px; }
    .samples { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .samples button { background: #0f172a; color: #e2e8f0; border: none; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>omdEquation (visual) math.js rendering</h1>
  <p>Enter any equation string. It is parsed with math.js and rendered using the same layout engine as the interactive core (functions, rationals, roots, etc.).</p>

  <div class="samples">
    <button type="button" data-example="sin(x)+2=3">sin(x) + 2 = 3</button>
    <button type="button" data-example="(x^2 + 3x - 4)/(2x) = 5">Rational form</button>
    <button type="button" data-example="sqrt(x+1) = 4">Square roots</button>
    <button type="button" data-example="f(x) = 2x^2 - 3x + 1">Function notation</button>
  </div>

  <form id="equation-form">
    <input id="equation-input" type="text" value="sin(x) + 2 = 3" aria-label="Equation">
    <button type="submit">Render</button>
  </form>

  <div id="equation-host"></div>
  <div id="error" style="color:#ef4444; margin-top:8px;"></div>
  <h3>Payload being rendered</h3>
  <pre id="json-preview" style="background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;overflow:auto;font-size:13px;"></pre>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
  <script type="module">
    import { createFromJSON } from '../src/omdFactory.js';
    import { omdDisplay } from '../omd/display/omdDisplay.js';

    const input = document.getElementById('equation-input');
    const form = document.getElementById('equation-form');
    const host = document.getElementById('equation-host');
    const errorBox = document.getElementById('error');

    // Initialize display once
    const display = new omdDisplay(host, {
      centerContent: true,
      fitToContent: false
    });

    function renderEquation(eqString) {
      if (!eqString || !eqString.includes('=')) {
        errorBox.textContent = 'Please include an "=" sign.';
        document.getElementById('json-preview').textContent = 'Invalid equation input';
        display.clear();
        return;
      }

      const payload = {
        omdType: 'equation',
        equation: eqString,
        fontSize: 32
      };

      document.getElementById('json-preview').textContent = JSON.stringify(payload, null, 2);

      try {
        const node = createFromJSON(payload);
        display.render(node);
        errorBox.textContent = '';
      } catch (err) {
        display.clear();
        errorBox.textContent = 'Render error: ' + (err?.message || err);
        console.error(err);
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      renderEquation(input.value.trim());
    });

    document.querySelectorAll('[data-example]').forEach(btn => {
      btn.addEventListener('click', () => {
        input.value = btn.getAttribute('data-example');
        renderEquation(input.value);
      });
    });

    renderEquation(input.value);
  </script>
</body>
</html>
