<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMD AI Visual Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --border: #DDDDDD;
            --muted: #AAAAAA;
        }

        body {
            font-family: 'Albert Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 24px;
            color: #AAAAAA;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 16px;
        }

        .row {
            display: flex;
            gap: 8px;
            margin: 8px 0;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        button {
            padding: 8px 12px;
            border: 1px solid var(--border);
            background: #EEEEEE;
            border-radius: 4px;
            cursor: pointer;
        }

        button:disabled {
            color: var(--muted);
            cursor: default;
        }

        .section {
            margin-top: 16px;
        }

        .section h2 {
            font-size: 14px;
            margin: 0 0 8px;
            color: #333;
            font-weight: 600;
        }

        #jsonResult {
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px;
            min-height: 120px;
        }

        #visualResult {
            min-height: 320px;
            border: 1px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible; /* Allow content to be visible */
            position: relative; /* Enable proper positioning */
        }

        .examples .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .examples .buttons button {
            font-size: 12px;
        }
        /* Enforce Albert Sans for SVG text */
        #visualResult svg text {
            font-family: 'Albert Sans', sans-serif !important;
        }
        /* Ensure UI controls use Albert Sans (override inline on textarea) */
        .container, .section, .json-output, .visual-output, input, button, textarea, h1, h2 {
            font-family: 'Albert Sans', sans-serif;
        }
        textarea { font-family: 'Albert Sans', sans-serif !important; }
    </style>
</head>

<body>
    <div class="container">
        <h1>OMD AI Visual Generator</h1>

        <div class="section">
            <div class="row">
                <input type="text" id="requestInput"
                    placeholder="Describe what you want to visualize (e.g., 'a balance hanger with 2x + 3 = 11')"
                    maxlength="500" />
                <button id="generateBtn">Generate</button>
                <button id="manualJsonBtn">Manual JSON Input</button>
            </div>
            <div id="manualJsonSection" style="display:none;">
                <textarea id="manualJsonInput" rows="10"
                    style="width:100%; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;"></textarea>
                <div class="row" style="justify-content:flex-end;">
                    <button id="renderManualJsonBtn">Render</button>
                    <button id="closeManualJsonBtn">Close</button>
                </div>
                <div id="manualJsonError" class="error" style="display:none;"></div>
            </div>
        </div>

        <div class="output-section section">
            <div class="json-output">
                <h2>Generated JSON</h2>
                <div id="jsonResult">Click "Generate" to see the AI-generated JSON...</div>
            </div>

            <div class="visual-output">
                <h2>Visual Rendering</h2>
                <div class="visual-controls"><button id="copySvgBtn" class="copy-btn" disabled>Copy PNG</button></div>
                <div id="visualResult">Visual will appear here after generation...</div>
            </div>
        </div>
    </div>

    <!-- Include required libraries -->
    <script src="https://unpkg.com/mathjs@14.5.2/lib/browser/math.js"></script>
    <script src="./omd/jsvg/jsvg.js"></script>
    <script src="./omd/jsvg/jsvgComponents.js"></script>
    <script type="module" src="./main-ai.js"></script>
</body>

</html>
