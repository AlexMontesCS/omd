<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPM Documentation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #2c3e50; }
        p { color: #666; margin: 20px 0; }
        .note {
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>📚 NPM Documentation</h1>
    <p>The documentation is being built...</p>
    
    <div class="note">
        <h3>For Local Development:</h3>
        <p>The npm-docs are built to <code>dist/npm-docs/</code></p>
        <p>Run <code>npm run build:npm-docs</code> first, then access:</p>
        <p><strong><a href="/dist/npm-docs/index.html">dist/npm-docs/index.html</a></strong></p>
        
        <h3>On Netlify:</h3>
        <p>The documentation will be available at <code>/npm-docs/</code></p>
    </div>
</body>
</html>
