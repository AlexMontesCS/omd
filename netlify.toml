[build]
  command = "npm install --include=optional --no-audit --no-fund && npm install --no-save @rollup/rollup-linux-x64-gnu@4.60.1 --no-audit --no-fund && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173      # The Vite dev server
  port = 8888            # Netlify Dev proxy port (must differ from targetPort)
  functionsPort = 9999
  autoLaunch = true