[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173      # The Vite dev server
  port = 8888            # Netlify Dev proxy port (must differ from targetPort)
  functionsPort = 9999
  autoLaunch = true